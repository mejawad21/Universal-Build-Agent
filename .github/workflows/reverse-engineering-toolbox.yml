name: Reverse Engineering Toolbox
on:
  workflow_dispatch:
jobs:
  verify-toolbox:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolbox" reports
          python3 - <<'PY'
          import json,urllib.request,zipfile,io,os
          root=os.environ["RUNNER_TEMP"]+"/toolbox"
          headers={"User-Agent":"streamshield-analysis"}
          for repo,folder,filter_name in [
            ("skylot/jadx","jadx",lambda n:n.startswith("jadx-") and n.endswith(".zip") and "gui" not in n),
            ("NationalSecurityAgency/ghidra","ghidra",lambda n:n.endswith(".zip") and "PUBLIC" in n)]:
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/releases/latest",headers=headers)
            info=json.load(urllib.request.urlopen(req,timeout=30))
            matches=[a for a in info["assets"] if filter_name(a["name"])]
            if not matches:raise RuntimeError("No release ZIP found for "+repo)
            a=matches[0]
            print("Installing",repo,info["tag_name"],a["name"])
            req=urllib.request.Request(a["browser_download_url"],headers=headers)
            with urllib.request.urlopen(req,timeout=180) as response:
              data=response.read()
            destination=os.path.join(root,folder)
            os.makedirs(destination,exist_ok=True)
            with zipfile.ZipFile(io.BytesIO(data)) as archive:archive.extractall(destination)
          PY
          find "$RUNNER_TEMP/toolbox/jadx" -type f -name jadx -exec chmod +x {} \;
          find "$RUNNER_TEMP/toolbox/ghidra" -type f -name analyzeHeadless -exec chmod +x {} \;
          JADX_BIN=$(find "$RUNNER_TEMP/toolbox/jadx" -type f -name jadx -print -quit)
          test -n "$JADX_BIN"
          "$JADX_BIN" --version
          GHIDRA_BIN=$(find "$RUNNER_TEMP/toolbox/ghidra" -type f -name analyzeHeadless -print -quit)
          test -n "$GHIDRA_BIN"
          test -x "$GHIDRA_BIN"
          echo "Ghidra headless installed: $GHIDRA_BIN"
      - name: Verify REA package
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm view rea-agents version
          npx --yes rea-agents --help > reports/rea-help.txt 2>&1
          echo "REA CLI ran successfully"
      - name: Write verified report
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "Reverse Engineering Toolbox - run $GITHUB_RUN_ID"
            date -u
            echo "Node: $(node --version)"
            echo "Java:"; java -version 2>&1
            echo "JADX executable:"; find "$RUNNER_TEMP/toolbox/jadx" -type f -name jadx 2>/dev/null | head -1 || true
            echo "Ghidra executable:"; find "$RUNNER_TEMP/toolbox/ghidra" -type f -name analyzeHeadless 2>/dev/null | head -1 || true
            echo "REA package version:"; npm view rea-agents version 2>&1 || true
            echo "REA CLI help file:"; test -s reports/rea-help.txt && echo "present" || echo "missing"
          } > reports/toolbox-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Toolbox-Verification-Report
          path: reports/
