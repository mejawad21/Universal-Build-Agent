name: JD PDF Pro Emulator Tests
on:
  push:
    paths:
      - 'jd-pdf-pro/**'
      - '.github/workflows/jd-pdf-pro-emulator-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build APK
        working-directory: jd-pdf-pro
        run: gradle --no-daemon assembleDebug
      - name: Prepare sample PDF
        run: |
          mkdir -p test-output
          python3 - <<'PY'
          from pathlib import Path
          text = b"BT /F1 20 Tf 70 730 Td (JD PDF Pro sample document) Tj ET"
          objs = [
            b"<< /Type /Catalog /Pages 2 0 R >>",
            b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
            b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
            b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
            b"<< /Length "+str(len(text)).encode()+b" >>\nstream\n"+text+b"\nendstream",
          ]
          out=bytearray(b"%PDF-1.4\n")
          offsets=[0]
          for n,body in enumerate(objs,1):
            offsets.append(len(out))
            out+=f"{n} 0 obj\n".encode()+body+b"\nendobj\n"
          start=len(out)
          out+=f"xref\n0 {len(objs)+1}\n".encode()+b"0000000000 65535 f \n"
          for off in offsets[1:]:
            out+=f"{off:010d} 00000 n \n".encode()
          out+=f"trailer\n<< /Size {len(objs)+1} /Root 1 0 R >>\nstartxref\n{start}\n%%EOF\n".encode()
          Path("test-output/sample.pdf").write_bytes(out)
          PY
      - name: Boot emulator and test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            APK=jd-pdf-pro/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell am force-stop com.jd.pdfpro || true
            adb shell am start -W -n com.jd.pdfpro/.MainActivity | tee test-output/launch.txt
            sleep 5
            adb shell screencap -p /sdcard/jd-home.png
            adb pull /sdcard/jd-home.png test-output/home.png
            adb push test-output/sample.pdf /sdcard/Download/JD-Sample.pdf
            adb shell am start -W -a android.intent.action.VIEW -d "file:///sdcard/Download/JD-Sample.pdf" -t application/pdf -n com.jd.pdfpro/.MainActivity | tee test-output/pdf-open.txt
            sleep 5
            adb shell screencap -p /sdcard/jd-pdf.png
            adb pull /sdcard/jd-pdf.png test-output/pdf-open.png
            adb logcat -d -v brief > test-output/logcat.txt
            if grep -A 15 'FATAL EXCEPTION' test-output/logcat.txt | grep -q 'com.jd.pdfpro'; then
              echo 'Application crash detected'
              exit 1
            fi
            test -s test-output/home.png
            test -s test-output/pdf-open.png
      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JD-PDF-Pro-Emulator-Test-Results
          path: test-output/
          if-no-files-found: warn
          retention-days: 30
