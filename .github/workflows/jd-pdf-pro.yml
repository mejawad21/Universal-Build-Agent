name: JD PDF Pro APK
on:
  push:
    paths:
      - 'jd-pdf-pro/**'
      - '.github/workflows/jd-pdf-pro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: jd-pdf-pro
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK
        run: |
          test -s jd-pdf-pro/app/build/outputs/apk/debug/app-debug.apk
          ls -lh jd-pdf-pro/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JD-PDF-Pro-APK
          path: jd-pdf-pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
