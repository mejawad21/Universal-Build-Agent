name: Build StreamShield APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'StreamShield/**'
      - '.github/workflows/build-streamshield.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StreamShield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StreamShield-APK
          path: StreamShield/app/build/outputs/apk/debug/*.apk
