name: Build and Publish StreamShield APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'StreamShield/**'
      - '.github/workflows/build-streamshield.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile StreamShield
        working-directory: StreamShield
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare APK
        run: |
          test -s StreamShield/app/build/outputs/apk/debug/app-debug.apk
          cp StreamShield/app/build/outputs/apk/debug/app-debug.apk StreamShield.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StreamShield-APK
          path: StreamShield.apk
          if-no-files-found: error
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="streamshield-v1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StreamShield.apk --clobber
          else
            gh release create "$TAG" StreamShield.apk --title "StreamShield 1.0 APK" --notes "Android YouTube browser with basic ad-domain filtering. Ad-free playback is not guaranteed." --target "$GITHUB_SHA"
          fi
