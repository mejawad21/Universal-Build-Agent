name: Build Velo Player v1.2
on:
  push:
    paths:
      - '.github/workflows/velo-resume.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract and upgrade Velo Player
        run: |
          mkdir -p /tmp/velo
          unzip -q Velo-Player-Android-Source.zip -d /tmp/velo
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/velo/app/src/main/java/com/velo/player/PlayerActivity.java')
          s=p.read_text()
          s=s.replace('    int videoW=0,videoH=0,duration=0,fitMode=0,originPosition=0,originalVolume=0;', '    int videoW=0,videoH=0,duration=0,fitMode=0,originPosition=0,originalVolume=0;\n    boolean completedPlayback=false;')
          s=s.replace('        footer.addView(buttons,lp(-1,57));', '''        footer.addView(buttons,lp(-1,57));
                  caption.setOnLongClickListener(v->{startOver();return true;});''')
          s=s.replace('    void toggle(){', '''    void startOver(){
                  if(prepared&&player!=null){
            player.seekTo(0);
            getSharedPreferences("resume",MODE_PRIVATE).edit().remove(videoUri).apply();
            toast("Started from beginning");
                  }
              }
              void toggle(){''')
          s=s.replace('''                long saved=getSharedPreferences("resume",MODE_PRIVATE).getLong(videoUri,0);
                if(saved>5000&&saved<duration-5000)mp.seekTo((int)saved);''','''                long saved=getSharedPreferences("resume",MODE_PRIVATE).getLong(videoUri,0);
                if(saved>0&&saved<duration-2500)mp.seekTo((int)saved);''')
          s=s.replace('''                getSharedPreferences("resume",MODE_PRIVATE).edit().remove(videoUri).apply();
            });''','''                completedPlayback=true;
                getSharedPreferences("resume",MODE_PRIVATE).edit().remove(videoUri).apply();
            });''')
          s=s.replace('''                if(prepared&&player.getDuration()>0){
                    long current=player.getCurrentPosition();
                    if(current<player.getDuration()-5000)getSharedPreferences("resume",MODE_PRIVATE)
                        .edit().putLong(videoUri,current).apply();
                }''','''                if(prepared&&player.getDuration()>0&&!completedPlayback){
                    long current=player.getCurrentPosition();
                    getSharedPreferences("resume",MODE_PRIVATE)
                        .edit().putLong(videoUri,current).commit();
                }''')
          s=s.replace('''                getSharedPreferences("resume",MODE_PRIVATE).edit()
                    .putLong(videoUri,player.getCurrentPosition()).apply();''','''                if(!completedPlayback)getSharedPreferences("resume",MODE_PRIVATE).edit()
                    .putLong(videoUri,player.getCurrentPosition()).commit();''')
          s=s.replace('''        handler.removeCallbacksAndMessages(null);release();super.onDestroy();''','''        handler.removeCallbacksAndMessages(null);release();super.onDestroy();''')
          p.write_text(s)
          main=Path('/tmp/velo/app/src/main/java/com/velo/player/MainActivity.java')
          ms=main.read_text()
          ms=ms.replace('import android.graphics.Color;', 'import android.graphics.Color;\\nimport android.graphics.Bitmap;\\nimport android.widget.ImageView;\\nimport android.util.Size;\\nimport android.os.Handler;\\nimport android.os.Looper;\\nimport java.util.concurrent.Executors;\\nimport java.util.concurrent.ExecutorService;\\nimport java.util.HashMap;')
          ms=ms.replace('    int tab=0; String searchText="", selectedFolder=null;', '    final ExecutorService thumbnailWorkers=Executors.newFixedThreadPool(2);\\n    final Handler uiHandler=new Handler(Looper.getMainLooper());\\n    final HashMap<String,Bitmap> thumbnailCache=new HashMap<>();\\n    int tab=0; String searchText="", selectedFolder=null;')
          ms=ms.replace('        getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);', '        getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);\\n        getWindow().getDecorView().setSystemUiVisibility(0);')
          ms=ms.replace('        parent.setBackgroundColor(BG);parent.setPadding(dp(17),dp(12),dp(17),0);','        parent.setBackgroundColor(BG);parent.setPadding(dp(17),dp(12),dp(17),dp(10));')
          ms=ms.replace('        parent.addView(videoList,new LinearLayout.LayoutParams(-1,0,1));','        parent.addView(videoList,new LinearLayout.LayoutParams(-1,0,1));')
          ms=ms.replace('            TextView tile=tv(folderRow?"▣":"▶",25,GREEN,true);\n            tile.setGravity(Gravity.CENTER);tile.setBackground(shape(0xFF29364B,11));\n            row.addView(tile,lp(81,66));', '''            android.widget.FrameLayout previewBox=new android.widget.FrameLayout(MainActivity.this);
            previewBox.setBackground(shape(0xFF29364B,11));
            ImageView image=new ImageView(MainActivity.this);
            image.setScaleType(ImageView.ScaleType.CENTER_CROP);
            previewBox.addView(image,new android.widget.FrameLayout.LayoutParams(-1,-1));
            TextView tile=tv(folderRow?"▣":"▶",25,GREEN,true);
            tile.setGravity(Gravity.CENTER);
            previewBox.addView(tile,new android.widget.FrameLayout.LayoutParams(-1,-1));
            row.addView(previewBox,lp(96,66));
            if(!folderRow){
                Video entry=shown.get(index);
                String key=entry.uri.toString();
                image.setTag(key);
                Bitmap cached=thumbnailCache.get(key);
                if(cached!=null){image.setImageBitmap(cached);tile.setVisibility(View.GONE);}
                else thumbnailWorkers.execute(()->{
                    try{
                        Bitmap bmp;
                        if(Build.VERSION.SDK_INT>=29)bmp=getContentResolver().loadThumbnail(entry.uri,new Size(192,132),null);
                        else bmp=MediaStore.Video.Thumbnails.getThumbnail(getContentResolver(),
                            Long.parseLong(entry.uri.getLastPathSegment()),MediaStore.Video.Thumbnails.MINI_KIND,null);
                        if(bmp!=null){
                            final Bitmap result=bmp;
                            uiHandler.post(()->{
                                thumbnailCache.put(key,result);
                                if(key.equals(image.getTag())){image.setImageBitmap(result);tile.setVisibility(View.GONE);}
                            });
                        }
                    }catch(Exception ignored){}
                });
            }''')
          ms=ms.replace('subline=clock(v.duration)+"  ·  "+v.folder+"  ·  "+v.size/1048576+" MB";', 'subline=clock(v.duration)+"  ·  "+v.folder+"  ·  "+String.format(Locale.US,"%.1f MB",v.size/1048576.0);')
          ms=ms.replace(chr(92)+'n', chr(10))
          main.write_text(ms)
          manifest=Path('/tmp/velo/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text().replace('android:allowBackup="false"','android:allowBackup="false"')
          manifest.write_text(xml)
          gradle=Path('/tmp/velo/app/build.gradle')
          gradle.write_text(gradle.read_text().replace('versionCode 1','versionCode 2').replace("versionName '1.0'","versionName '1.2'"))
          PY
      - name: Android SDK setup
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: /tmp/velo
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Velo-Player-v1.2
          path: /tmp/velo/app/build/outputs/apk/debug/app-debug.apk
