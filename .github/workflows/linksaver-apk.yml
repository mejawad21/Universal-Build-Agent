name: Build and Publish LinkSaver APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LinkSaver-Android/**'
      - '.github/workflows/linksaver-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: LinkSaver-Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Copy APK to predictable name
        run: |
          APK="LinkSaver-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='4.0'"
          cp "$APK" LinkSaver-v4.0.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-v4.0-APK
          path: LinkSaver-v4.0.apk
          if-no-files-found: error
      - name: Publish directly downloadable APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="linksaver-v4.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LinkSaver-v4.0.apk --clobber
          else
            gh release create "$TAG" LinkSaver-v4.0.apk --title "LinkSaver 4.0 Social Video Downloader APK" --notes "LinkSaver 4.0 with automatic yt-dlp engine updates. Download only content you are authorized to save." --target "$GITHUB_SHA"
          fi
