name: Build LinkSaver APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LinkSaver-Android/**'
      - '.github/workflows/linksaver-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "${ANDROID_HOME:-/opt/android-sdk}" || exit 1
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: LinkSaver-Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-APK
          path: LinkSaver-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
